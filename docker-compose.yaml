name: subsyncarr

services:
  subsyncarr:
    build:
      context: .
      dockerfile: Dockerfile
    image: subsyncarr-ng:latest
    container_name: subsyncarr
    ports:
      - '3030:3000' # Web UI on port 3030
    volumes:
      # Mount your media directories
      - ${DATA}/Multimedia/Film:/movies
      - ${DATA}/Multimedia/Serie Tv:/tv
      - ${DOCKER_APPDATA}/subsyncarr:/app/data # Persist database across restarts
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2048M     # Increased from 768M to avoid OOM killer on 4K/2160p and multi-engine runs
        reservations:
          memory: 256M      # Minimum guaranteed memory
    environment:
      - PUID=${PUID:-1000} # Set to your user's UID (run `id -u` to find it)
      - PGID=${PGID:-100} # Set to your user's GID (run `id -g` to find it)
      - TZ=${TZ:-Europe/Rome} # Replace with your own timezone
      - CRON_SCHEDULE=0 0 * * * # Runs every day at midnight by default
      - SCAN_PATHS=/movies,/tv # Remember to mount these as volumes. Must begin with /. Default valus is `/scan_dir`
      - EXCLUDE_PATHS=/movies/temp,/tv/downloads # Exclude certain sub-directories from the scan
      - MAX_CONCURRENT_SYNC_TASKS=1 # Defaults to 1 if not set. Higher number will consume more CPU but sync your library faster
      - INCLUDE_ENGINES=ffsubsync,autosubsync,alass # Engines to use (ffsubsync, autosubsync, alass)
      - AUTOSUBSYNC_PARALLELISM=1 # 1 worker to save memory and avoid OOM kills on 4K files
      - AUTOSUBSYNC_SKIP_FORCED=true # Skip forced subtitles for autosubsync (ffsubsync and alass will handle them)
      - DELETE_ORPHANED_SRT=true # Automatically delete subtitle files if no matching video is found
      # Memory configuration (optional):
      # - NODE_OPTIONS=--max-old-space-size=1024 # Increase if you experience OOM errors (default: 512)
      # Timeout configuration (optional - uncomment and adjust if needed):
      # - SYNC_ENGINE_TIMEOUT_MS=1800000  # 30 minutes (default)
      # - SYNC_ENGINE_TIMEOUT_MS=3600000  # 60 minutes for very large files
      # - SYNC_ENGINE_TIMEOUT_MS=600000   # 10 minutes for smaller files
      # Web UI configuration (optional):
      # - WEB_PORT=3000                   # Port for web UI (default: 3000)
      # - WEB_HOST=127.0.0.1              # Host to bind to (default: 127.0.0.1, use 0.0.0.0 for all interfaces)
      # - DB_PATH=/app/data/subsyncarr.db # SQLite database location (default: /app/data/subsyncarr.db)
